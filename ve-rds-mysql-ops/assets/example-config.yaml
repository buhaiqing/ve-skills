# RDS MySQL instance configuration example
# YAML anchors deduplicate shared values across environments.
---
shared: &shared
  DBEngineVersion: "MySQL_8_0"
  SpecFamily: "rdsmysql.g2"
  StorageSpace: 200
  SuperAccountPassword: "${DB_PASSWORD}"

environments:
  production:
    <<: *shared
    InstanceName: "prod-mysql-01"
    SpecCode: "rdsmysql.g2.large"
    VpcId: "vpc-xxxxx"
    SubnetId: "subnet-yyyyy"
    ChargeType: "PostPaid"
    ProjectName: "default"
    ZoneId: "cn-beijing-a"
    Tags:
      - Key: "Environment"
        Value: "production"
      - Key: "Team"
        Value: "platform"

  staging:
    <<: *shared
    InstanceName: "staging-mysql-01"
    SpecCode: "rdsmysql.g2.medium"
    VpcId: "vpc-xxxxx"
    SubnetId: "subnet-zzzzz"
    ChargeType: "PostPaid"
    ProjectName: "staging"
    ZoneId: "cn-beijing-b"
    Tags:
      - Key: "Environment"
        Value: "staging"
      - Key: "Team"
        Value: "platform"
