# Example ALB Configuration
# Volcengine ALB (应用型负载均衡) — production-ready setup

# ALB Instance
load_balancer:
  name: prod-api-alb
  type: public              # public (internet-facing) or private (internal)
  description: Production API ALB
  eip_billing_config:
    bandwidth: 50            # Mbps
    eip_billing_type: PayByTraffic
    isp: BGP

# Listeners
listeners:
  - name: https-443
    protocol: HTTPS
    port: 443
    certificate_id: cert-abc123
    tls_policy: tls-1-2
    server_group_id: sg-api-servers

  - name: http-80
    protocol: HTTP
    port: 80
    server_group_id: sg-api-servers

# Server Groups
server_groups:
  - name: sg-api-servers
    type: instance             # instance (ECS) or ip (IP address)
    description: API backend servers
    health_check:
      enabled: true
      protocol: HTTP
      method: GET
      uri: /health
      timeout: 3               # seconds
      interval: 5              # seconds
      healthy_threshold: 3
      unhealthy_threshold: 3
      healthy_http_code: "200"

# Backend Servers (ECS instances)
backend_servers:
  - server_id: i-xxxxxxxxx
    port: 8080
    weight: 100
    server_type: ecs
  - server_id: i-yyyyyyyyy
    port: 8080
    weight: 100
    server_type: ecs

# Routing Rules (for HTTPS listener)
rules:
  - name: api-v1
    listener_name: https-443
    server_group_name: sg-api-servers
    domain: api.example.com
    url: /v1/*
  - name: web-app
    listener_name: https-443
    server_group_name: sg-web-servers
    domain: app.example.com
    url: /*
