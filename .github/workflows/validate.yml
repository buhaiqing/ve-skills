name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git merge-base (eval regression --git-diff)

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skills frontmatter
        run: python3 scripts/validate_skills_frontmatter.py

      - name: Check markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Check GCL conformance
        run: python3 scripts/check_gcl_conformance.py

      - name: Run local validation
        run: python3 scripts/validate_local.py

      - name: Check eval regression (absolute match + git-diff)
        run: python3 scripts/check_eval_regression.py --git-diff origin/main
