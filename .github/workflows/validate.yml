name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git merge-base (eval --git-diff)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/vet/go.mod

      - name: Build vet
        working-directory: cmd/vet
        run: go build -ldflags "-X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo '0.0.0-dev') -X main.commit=$(git rev-parse --short HEAD 2>/dev/null || echo '')" -o ../bin/vet .

      - name: Check skill frontmatter
        run: cmd/bin/vet check frontmatter --root .

      - name: Check markdown links
        run: cmd/bin/vet check links --root .

      - name: Check GCL conformance
        run: cmd/bin/vet check gcl --root .

      - name: Check AIOps/FinOps/SecurityOps coverage
        run: cmd/bin/vet check aiops --root .

      - name: Check product assessment
        run: cmd/bin/vet check assessment --root .

      - name: Check eval regression (absolute + git-diff)
        run: cmd/bin/vet check eval --root . --git-diff origin/main

      - name: Run local validation suite
        run: cmd/bin/vet validate --root .

      - name: GCL structural CI gate
        run: cmd/bin/vet gcl gate --root . --skip-incident-loop

      - name: Check GCL trace request_id enforcement (P5)
        run: cmd/bin/vet check trace --root .

      - name: Check policy safety invariant (P7)
        run: cmd/bin/vet check policyguard --root .
