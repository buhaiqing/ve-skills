name: test

on:
  pull_request:
    paths:
      - "cmd/vet/**"
      - ".goreleaser.yaml"
  push:
    branches:
      - main
    paths:
      - "cmd/vet/**"
      - ".goreleaser.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/vet/go.mod

      - name: Build
        working-directory: cmd/vet
        run: go build ./...

      - name: Vet
        working-directory: cmd/vet
        run: go vet ./...

      - name: Test
        working-directory: cmd/vet
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/vet/go.mod

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
