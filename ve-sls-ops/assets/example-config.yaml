# SLS (Simple Log Service) Example Configuration
# Environment-specific overrides using YAML anchors
# Base defaults shared across all environments
defaults: &defaults
  region: "cn-beijing"
  retention_days: 30
  enable_alerting: true
  notification_type: "email"
  notification_target: "ops@company.com"

development:
  <<: *defaults
  enable_alerting: false
  notification_target: "dev@company.com"

staging:
  <<: *defaults
  region: "cn-shanghai"

production:
  <<: *defaults
  retention_days: 90
  enable_alerting: true
  notification_target: "ops@company.com"
