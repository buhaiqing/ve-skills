# Volcengine RDS MySQL Example Configuration
#
# This example configuration demonstrates a typical RDS MySQL setup for a
# production environment with HA instance, databases, accounts,
# and allow lists.

---

# Environment
environment: production
region: "{{env.VOLCENGINE_REGION}}"
project_name: production

# RDS Instance Configuration
rds_instances:
  - name: "prod-mysql-primary"
    db_engine_version: "MySQL_8_0"
    instance_type: "HA"
    node_spec: "rds.mysql.4c8g"
    storage_space: 200
    storage_type: "ESSD"
    vpc_id: "{{vpc.production_id}}"
    subnet_id: "{{subnet.db_a_id}}"
    node_info:
      - ZoneId: "cn-beijing-a"
      - ZoneId: "cn-beijing-b"
    charge_type: "PostPaid"
    tags:
      - key: "tier"
        value: "database"
      - key: "environment"
        value: "production"

# Databases
databases:
  - instance_name: "prod-mysql-primary"
    name: "app_main"
    charset: "utf8mb4"
    description: "Main application database"

  - instance_name: "prod-mysql-primary"
    name: "app_analytics"
    charset: "utf8mb4"
    description: "Analytics data warehouse"

# Database Accounts
accounts:
  - instance_name: "prod-mysql-primary"
    name: "app_rw"
    type: "Normal"
    privileges:
      - db: "app_main"
        privilege: "ReadWrite"
      - db: "app_analytics"
        privilege: "ReadWrite"

  - instance_name: "prod-mysql-primary"
    name: "analytics_ro"
    type: "Normal"
    privileges:
      - db: "app_analytics"
        privilege: "ReadOnly"

# Parameter Tuning
parameters:
  - instance_name: "prod-mysql-primary"
    name: "max_connections"
    value: "2000"
  - instance_name: "prod-mysql-primary"
    name: "innodb_buffer_pool_size"
    value: "4G"
  - instance_name: "prod-mysql-primary"
    name: "max_allowed_packet"
    value: "64M"

# Allow Lists
allow_lists:
  - instance_name: "prod-mysql-primary"
    name: "app-servers"
    ips:
      - "10.0.2.0/24"   # App subnet
      - "10.0.3.0/24"   # API subnet
    type: "IPv4"

# Backup Configuration
backup:
  schedule: "02:00-06:00"
  retention_days: 30
  strategy: "Snapshot"
  frequency: "Daily"

# Default tags
default_tags:
  - key: "managed-by"
    value: "ve-rds-ops"
  - key: "team"
    value: "infrastructure"
